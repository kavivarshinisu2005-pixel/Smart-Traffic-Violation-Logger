<!DOCTYPE html>
<html>
<head>
<title>Add</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2>Add Violation</h2>

<form method="POST" class="card p-4 shadow">

<input name="vehicle" placeholder="Vehicle Number" class="form-control mb-2">
<input name="type" placeholder="Violation Type" class="form-control mb-2">
<input name="location" placeholder="Location" class="form-control mb-2">
<input name="date" type="date" class="form-control mb-2">
<input name="fine" placeholder="Fine Amount" class="form-control mb-2">

<button class="btn btn-success">Submit</button>

</form>

</div>

</body>
</html>
