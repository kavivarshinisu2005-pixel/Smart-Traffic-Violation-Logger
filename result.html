<!DOCTYPE html>
<html>
<head>
<title>Results</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-white">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-black">
  <div class="container">
    <a class="navbar-brand" href="/">🚦 Traffic Logger</a>
  </div>
</nav>
<div class="text-center mt-2">
    <a href="/" class="btn btn-outline-light">🏠 Back to Home</a>
</div>
<div class="container mt-4">

    <h2 class="text-center mb-4">🔍 Search Results</h2>

    <!-- TOTAL FINE -->
    <div class="alert alert-warning text-center">
        💰 Total Fine: ₹{{total}}
    </div>

    <!-- IF NO DATA -->
    {% if data|length == 0 %}
        <div class="alert alert-danger text-center">
            No Records Found 🚫
        </div>
    {% endif %}

    <!-- LOOP -->
    {% for i in data %}

    <div class="card text-dark mb-4 shadow-lg">

        <div class="card-body">

            <h4 class="card-title">🚗 {{i.vehicle}}</h4>

            <p>
                ⚠️ <b>{{i.violation}}</b><br>
                📍 {{i.location}}<br>
                📅 {{i.date}}<br>
                💰 ₹{{i.fine}}
            </p>

            <!-- STATUS BADGE -->
            <span class="badge bg-{{ 'success' if i.status=='Paid' else 'danger' }} p-2">
                {{i.status}}
            </span>

            <br><br>

            <!-- PAY BUTTON -->
            <a href="/pay/{{i.id}}" class="btn btn-warning">
                💳 Mark as Paid
            </a>

            <br><br>

            <!-- QR -->
            <img src="/static/qr_codes/{{i.id}}.png" width="120">

        </div>
    </div>

    {% endfor %}

</div>

</body>
</html>
